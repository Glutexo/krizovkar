format: krizovkar
kind: specification
version: 1
grid:
  width: 5
  height: 3
words:
  - answer: TXAXJ
    start: {row: 1, column: 1}
    direction: horizontal
    legend: První řádek
  - answer: XEXNX
    start: {row: 2, column: 1}
    direction: horizontal
    legend: Druhý řádek
  - answer: KXXXA
    start: {row: 3, column: 1}
    direction: horizontal
    legend: Třetí řádek
secrets:
  - type: cells
    cells:
      - {row: 3, column: 5}
      - {row: 1, column: 5}
      - {row: 2, column: 4}
      - {row: 1, column: 1}
      - {row: 3, column: 1}
      - {row: 1, column: 3}
      - {row: 2, column: 2}
