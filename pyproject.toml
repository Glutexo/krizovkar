[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krizovkar"
version = "0.1.0"
description = "Nástroj pro tvorbu švédských, klasických a dalších křížovek."
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
dependencies = [
    "jsonschema>=4.26,<5",
    "pymupdf-fonts>=1.0.5,<2",
    "reportlab>=5.0,<6",
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.scripts]
krizovkar = "krizovkar.cli:main"

[project.urls]
Repository = "https://github.com/Glutexo/krizovkar"

[tool.hatch.build.targets.wheel]
packages = ["src/krizovkar"]
